{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/index.css' %}?v=1.6" />
{% endblock %}


{% block content %}

<!-- PAGE LAYOUT -->
<main class="page-layout">

    <!-- PAGE HEADER -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Calendar</h1>
            <p class="page-subtitle">Drag on the calendar to book equipment.</p>
        </div>
        <div class="page-actions">
            <button class="btn btn-outline">
                <svg class="btn-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="10" cy="7" r="4" />
                    <path d="M3 17a7 7 0 0 1 14 0" />
                </svg>
                My bookings
            </button>
            <button class="btn btn-primary">
                <svg class="btn-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="3" y="4" width="14" height="13" rx="2" />
                    <path d="M3 8h14" />
                    <path d="M10 11v4M8 13h4" />
                </svg>
                New booking
            </button>
        </div>
    </div>

    <!-- CONTENT AREA -->
    <div class="content-area">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Equipment</span>
                <div class="sidebar-toggles">
                    <button class="toggle-btn active">All</button>
                    <span class="toggle-sep">/</span>
                    <button class="toggle-btn">None</button>
                </div>
            </div>
            <ul class="equipment-list">
                {% for equipment in equipment_list %}
                <li class="equipment-item">
                    <label class="eq-label">
                        <input type="checkbox" value="{{equipment.id}}" checked />
                        <span class="eq-dot" style="background-color: {{ equipment.color|default:'purple' }};"></span>
                        <div class="eq-info">
                            <span class="eq-name">{{equipment.name}}.</span>
                            <span class="eq-meta">{{equipment.location}}</span>
                            <span class="eq-meta">{{equipment.min_booking_time}} mins</span>
                        </div>
                    </label>
                </li>
                {% endfor %}
            </ul>
            <div class="sidebar-footer">
                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" class="drag-icon">
                    <circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none" />
                    <circle cx="13" cy="7" r="1.2" fill="currentColor" stroke="none" />
                    <circle cx="7" cy="13" r="1.2" fill="currentColor" stroke="none" />
                    <circle cx="13" cy="13" r="1.2" fill="currentColor" stroke="none" />
                    <circle cx="7" cy="10" r="1.2" fill="currentColor" stroke="none" />
                    <circle cx="13" cy="10" r="1.2" fill="currentColor" stroke="none" />
                </svg>
                Drag on the calendar to book
            </div>
        </aside>

        <!-- CALENDAR PANEL -->
        <section class="calendar-panel">

            <!-- Toolbar -->
            <div class="cal-toolbar">

                <div class="cal-nav">
                    <button id="fc-prev" class="cal-nav-btn">&#8249;</button>
                    <button id="fc-next" class="cal-nav-btn">&#8250;</button>
                    <button id="fc-today" class="cal-today-btn">Today</button>
                </div>

                <h2 class="cal-range" id="calendar-title"></h2>

                <div class="cal-view-tabs">
                    <button id="view-day" class="view-tab">Day</button>
                    <button id="view-3day" class="view-tab active">3 Days</button>
                    <button id="view-week" class="view-tab">Week</button>
                    <button id="view-month" class="view-tab">Month</button>
                </div>

            </div>

            <div class="calendar-wrapper">
                <div id="calendar"></div>
            </div>

        </section>

    </div>

    <!-- <link rel="stylesheet" href="{% static 'css/index.global.min.css' %}"> -->

    <script src="{% static 'js/index.global.min.js' %}"></script>

    <script>
        const BOOKINGS = {{ booking_list| safe }};
    </script>

    <script src="{% static 'js/filter_equipment.js' %}"></script>

    <script src="{% static 'js/index.js' %}?v=1.1"></script>
</main>



{% endblock content %}
